apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-document-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-document-backend

  template:
    metadata:
      labels:
        app: ai-document-backend

    spec:
      containers:
        - name: backend
          image: ai-document-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - secretRef:
                name: ai-document-backend-secret
            - configMapRef:
                name: ai-document-backend-config

          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads

      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: ai-document-uploads-pvc