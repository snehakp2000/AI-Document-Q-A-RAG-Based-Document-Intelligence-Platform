apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-document-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-document-frontend

  template:
    metadata:
      labels:
        app: ai-document-frontend

    spec:
      containers:
        - name: frontend
          image: ai-document-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"