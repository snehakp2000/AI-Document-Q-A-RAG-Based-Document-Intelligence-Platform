name: AI Document CD

on:
  workflow_run:
    workflows: ["AI Document CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/AI-Document-Q-A-RAG-Based-Document-Intelligence-Platform

            git pull origin main

            cd backend
            npm install
            pm2 restart ai-document-backend

            cd ../frontend
            npm install
            npm run build

            sudo systemctl reload nginx